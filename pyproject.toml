[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmoforge"
version = "0.1.0"
description = "An AI worldview simulation framework: Big Bang -> parallel universes -> planets -> random events, with pluggable model providers and an interactive HTML mind map."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Cosmoforge contributors" }]
keywords = ["worldbuilding", "simulation", "universe", "multiverse", "llm", "mindmap"]

[project.urls]
Homepage = "https://github.com/XLYZ-P/Cosmoforge"
Repository = "https://github.com/XLYZ-P/Cosmoforge"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cosmoforge = "cosmoforge.cli:main"

[tool.setuptools.packages.find]
include = ["cosmoforge*"]

[tool.setuptools.package-data]
cosmoforge = ["web/*.html", "web/*.css", "web/*.js"]
