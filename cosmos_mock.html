<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Aeloria Multiverse — Cosmos Mind Map</title>
<style>
  :root{
    --bg:#0b0f19; --bg2:#111726; --bg3:#0e1524; --line:#26314a; --fg:#e8ecf5;
    --muted:#8b97b0; --accent:#f5c451;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 800px at 20% -10%, #16203a 0%, var(--bg) 55%);
    color:var(--fg);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Noto Sans SC",sans-serif;
    overflow:hidden;
  }
  #bar{
    position:fixed;inset:0 0 auto 0;min-height:52px;display:flex;align-items:center;
    gap:8px;padding:6px 14px;background:rgba(10,14,24,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);z-index:20;flex-wrap:wrap;
  }
  #bar .brand{font-weight:700;letter-spacing:.3px;color:var(--accent);white-space:nowrap;
    max-width:26vw;overflow:hidden;text-overflow:ellipsis}
  #search{
    background:var(--bg2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6px 10px;min-width:150px;outline:none;
  }
  #search:focus{border-color:var(--accent)}
  #bar .spacer{flex:1}
  button{
    background:var(--bg2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;
  }
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.on{border-color:var(--accent);color:var(--accent)}
  .zoomwrap{display:flex;align-items:center;gap:8px;
    background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
  #zoom{width:130px;accent-color:var(--accent)}
  #zoomval{color:var(--muted);font-size:12px;min-width:40px;text-align:right}
  main{position:fixed;inset:52px 0 0 0}
  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  .link{fill:none;stroke:#33405e;stroke-width:1.6}
  .link.active{stroke:var(--accent);stroke-width:2.4}
  .node{cursor:pointer}
  .node rect{stroke:rgba(255,255,255,.14);stroke-width:1}
  .node text{fill:#0b0f19;font-size:13px;font-weight:600;dominant-baseline:middle;
    pointer-events:none;user-select:none}
  .node.dim{opacity:.28}
  .node.hit rect{stroke:#fff;stroke-width:2.4}
  .node.active rect{stroke:var(--accent);stroke-width:2.6}
  #panel{
    position:fixed;top:66px;right:14px;width:352px;max-height:calc(100vh - 120px);
    overflow:auto;background:rgba(17,23,38,.97);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;z-index:15;box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  #panel.hidden{display:none}
  #panel h2{margin:0 0 4px;font-size:16px}
  #panel .kind{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.4px}
  #panel p{color:#cdd6ea;font-size:13px;white-space:pre-wrap}
  #panel table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
  #panel td{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
  #panel td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap}
  #panel .close{float:right;cursor:pointer;color:var(--muted)}
  #panel .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  #panel .actions button{background:#182238}
  #panel .status{margin-top:10px;font-size:12px;color:var(--muted);min-height:14px}
  #legend{
    position:fixed;left:14px;bottom:14px;z-index:15;background:rgba(17,23,38,.92);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;
  }
  #legend .row{display:flex;align-items:center;gap:8px;margin:2px 0}
  #legend .chip{width:11px;height:11px;border-radius:3px;display:inline-block}
  #hint{position:fixed;right:16px;bottom:14px;color:var(--muted);font-size:11.5px;z-index:15}

  /* ---- timeline panel ---- */
  #timeline{
    position:fixed;left:0;right:0;bottom:0;height:44vh;min-height:150px;z-index:18;
    background:rgba(9,13,22,.98);border-top:1px solid var(--line);
    display:flex;flex-direction:column;transform:translateY(0);transition:transform .18s ease;
  }
  #timeline.hidden{transform:translateY(101%)}
  #tl-handle{height:8px;cursor:ns-resize;background:linear-gradient(transparent,rgba(245,196,81,.10));
    border-top:1px solid var(--line);flex:0 0 auto}
  #tl-head{display:flex;align-items:center;gap:10px;padding:4px 14px;flex:0 0 auto;
    border-bottom:1px solid rgba(38,49,74,.6)}
  #tl-head b{color:var(--accent);font-size:13px}
  #tl-head .sub{color:var(--muted);font-size:11.5px}
  #tl-body{flex:1 1 auto;overflow:auto;padding:0 0 6px}
  svg#tl{display:block}
  .tl-cap{fill:var(--muted);font-size:10px;letter-spacing:.6px}
  .tl-axis{stroke:var(--line);stroke-width:1}
  .tl-grid{stroke:#1c2438;stroke-width:1}
  .tl-gridlabel{fill:var(--muted);font-size:10px}
  .tl-tick{stroke:#ff8a3d;stroke-width:1}
  .tl-elabel{fill:#c9a227;font-size:9px}
  .tl-rowlabel{fill:#c4cde0;font-size:11.5px}
  .tl-rowlabel.hi{fill:var(--accent)}
  .tl-bar{opacity:.35;rx:3}
  .tl-ev{cursor:pointer}
  .tl-ev:hover{stroke:#fff;stroke-width:1.6}
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:40;
    background:#1b2740;border:1px solid var(--line);color:var(--fg);border-radius:10px;
    padding:8px 14px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header id="bar">
  <div class="brand">✦ The Aeloria Multiverse</div>
  <input id="search" placeholder="Search nodes…" autocomplete="off" />
  <div class="spacer"></div>
  <div class="zoomwrap">
    <button data-act="out" title="Zoom out (−)">－</button>
    <input id="zoom" type="range" min="8" max="350" value="100" />
    <button data-act="in" title="Zoom in (+)">＋</button>
    <span id="zoomval">100%</span>
  </div>
  <button data-act="fit" title="Fit to window (F)">适应</button>
  <button data-act="reset" title="Reset to 100% (0)">100%</button>
  <button data-act="timeline" id="tl-toggle">时间线</button>
  <button data-act="collapse">折叠全部</button>
  <button data-act="expandall">展开全部</button>
  <button data-act="svg">导出 SVG</button>
</header>
<main>
  <svg id="map">
    <g id="viewport">
      <g id="links"></g>
      <g id="nodes"></g>
    </g>
  </svg>
  <aside id="panel" class="hidden"></aside>
  <div id="legend"></div>
  <div id="hint">点击节点折叠/展开 · 拖拽平移 · 滚轮缩放 · 快捷键 + − 0 F</div>
</main>
<section id="timeline" class="hidden">
  <div id="tl-handle" title="拖动调整高度"></div>
  <div id="tl-head">
    <b>时间线</b>
    <span class="sub">横轴：大爆炸之后的宇宙时间（Gyr）· 顶栏：大爆炸纪元（对数时间，秒）</span>
  </div>
  <div id="tl-body"><svg id="tl"></svg></div>
</section>
<div id="toast"></div>
<script>
"use strict";
const DATA = {"id": "root", "label": "The Aeloria Multiverse", "kind": "root", "detail": "A cosmos of 2 parallel universes and 9 worlds, generated from seed 1337.", "meta": {"seed": 1337, "universes": 2, "planets": 9, "events": 37, "provider": "mock", "model": "mock-1"}, "children": [{"id": "bigbang", "label": "Big Bang", "kind": "bigbang", "detail": "A shattered horizon unfolds here. [mock:e8fdf1e0]", "meta": {"epochs": 11, "seed": 1337}, "children": [{"id": "epoch:Planck epoch", "label": "Planck epoch", "kind": "epoch", "detail": "Gravity and the other forces are one. Spacetime is a quantum foam with no stable geometry; time itself is not yet meaningful.", "meta": {"age": "1e-43 s", "age_years": 3.2e-51, "temperature": "1e+32 K"}, "children": []}, {"id": "epoch:Grand unification", "label": "Grand unification", "kind": "epoch", "detail": "Gravity decouples from the unified force. A first arrow of time appears as the young cosmos begins to cool.", "meta": {"age": "3e-42 s", "age_years": 1e-49, "temperature": "1e+29 K"}, "children": []}, {"id": "epoch:Inflation", "label": "Inflation", "kind": "epoch", "detail": "Space expands by a factor of 10^26 in a fraction of a second. Quantum fluctuations are stretched into the seeds of every galaxy that will ever exist.", "meta": {"age": "1e-36 s", "age_years": 3.2e-44, "temperature": "1e+27 K"}, "children": []}, {"id": "epoch:Electroweak epoch", "label": "Electroweak epoch", "kind": "epoch", "detail": "The strong force separates. Particles acquire mass through the Higgs field as symmetry breaks.", "meta": {"age": "5e-31 s", "age_years": 1.6e-38, "temperature": "1e+15 K"}, "children": []}, {"id": "epoch:Quark epoch", "label": "Quark epoch", "kind": "epoch", "detail": "Quarks, leptons and gluons move freely. Matter and antimatter annihilate in a faintly lopsided contest.", "meta": {"age": "4e-29 s", "age_years": 1.2e-36, "temperature": "1e+12 K"}, "children": []}, {"id": "epoch:Hadron epoch", "label": "Hadron epoch", "kind": "epoch", "detail": "Quarks bind into protons and neutrons. The surviving matter/antimatter asymmetry freezes in at roughly one baryon per billion photons.", "meta": {"age": "1e-18 s", "age_years": 3.2e-26, "temperature": "1e+10 K"}, "children": []}, {"id": "epoch:Lepton epoch", "label": "Lepton epoch", "kind": "epoch", "detail": "Neutrinos decouple and stream away. Electrons and positrons annihilate, leaving the lepton budget that will feed the first atoms.", "meta": {"age": "1e-08 s", "age_years": 3.2e-16, "temperature": "1e+09 K"}, "children": []}, {"id": "epoch:Nucleosynthesis", "label": "Nucleosynthesis", "kind": "epoch", "detail": "Primordial fusion forges hydrogen, helium and a trace of lithium. The elemental recipe of the cosmos is set within minutes.", "meta": {"age": "2e-01 s", "age_years": 5.7e-09, "temperature": "1e+08 K"}, "children": []}, {"id": "epoch:Recombination", "label": "Recombination", "kind": "epoch", "detail": "Electrons finally bind to nuclei. The fog clears, photons stream free, and the cosmic microwave background is released.", "meta": {"age": "3.3 h", "age_years": 0.00038, "temperature": "3e+03 K"}, "children": []}, {"id": "epoch:Dark ages", "label": "Dark ages", "kind": "epoch", "detail": "Neutral hydrogen fills a lightless, cooling cosmos. Gravity quietly assembles the first filaments of structure.", "meta": {"age": "3.7 d", "age_years": 0.01, "temperature": "6e+01 K"}, "children": []}, {"id": "epoch:Reionization", "label": "Reionization", "kind": "epoch", "detail": "The first stars ignite, then die, reionizing the intergalactic medium. The universe becomes visible to itself.", "meta": {"age": "182.6 d", "age_years": 0.5, "temperature": "3e+01 K"}, "children": []}]}, {"id": "uni:0001", "label": "Vexis", "kind": "universe", "detail": "A shattered engine unfolds here. [mock:d52ba744]", "meta": {"generation": 0, "destiny": "big crunch", "age": "12.9 Gyr", "age_gyr": 12.9, "habitability": 0.53, "expansion": 0.93, "worlds": 5, "gravity": 0.821, const LIVE = false;
const API_BASE = "";

const KIND_COLORS = {
  root:"#f5c451", bigbang:"#ff8a3d", epoch:"#d9b64a",
  universe:"#5b8def", planet:"#3fbf7f", event:"#c678dd"
};
const KIND_LABEL = {
  root:"Cosmos", bigbang:"Origin", epoch:"Epoch",
  universe:"Universe", planet:"Planet", event:"Event"
};
const CAN_EXPAND = {root:1, bigbang:1, universe:1, planet:1, event:1, epoch:0};
const ROW = 38, GAP = 62, MINW = 150, PADX = 16, CHAR = 7.7, NODEH = 26;
const SEC_PER_YEAR = 31557600;

const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");
const linksG = document.getElementById("links");
const nodesG = document.getElementById("nodes");
const panel = document.getElementById("panel");
const searchBox = document.getElementById("search");
const zoomSlider = document.getElementById("zoom");
const zoomVal = document.getElementById("zoomval");
const tl = document.getElementById("timeline");
const tlBody = document.getElementById("tl-body");
const tlSvg = document.getElementById("tl");
const toast = document.getElementById("toast");

let collapsed = new Set();
let query = "";
let scale = 1, tx = 40, ty = 40;
let bounds = { w: 1200, h: 800 };
let byId = new Map();
let parentIndex = new Map();
let selectedId = null;

/* ------------------------------------------------------------------ */
/* helpers                                                             */
/* ------------------------------------------------------------------ */
function sevColor(sev){
  const s = Math.max(0, Math.min(1, Number(sev) || 0.5));
  return `hsl(${285 - 15 * s}, 62%, ${62 - 12 * s}%)`;
}
function nodeColor(n){
  if (n.kind === "event") return sevColor((n.meta && n.meta.severity) || 0.5);
  return KIND_COLORS[n.kind] || "#9aa4bb";
}
function labelText(n){
  const icon = { root:"✦", bigbang:"✷", epoch:"·", universe:"◆", planet:"●", event:"▲" }[n.kind] || "•";
  return icon + "  " + n.label;
}
function nodeWidth(n){ return Math.max(MINW, labelText(n).length * CHAR + PADX * 2 + 6); }
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function pathD(x1, y1, x2, y2){
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}
function walkAll(node, depth, fn){
  fn(node, depth);
  (node.children || []).forEach(c => walkAll(c, depth + 1, fn));
}
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2600);
}

/* ------------------------------------------------------------------ */
/* mind map                                                            */
/* ------------------------------------------------------------------ */
function computeLayout(){
  const vis = [];
  let cursor = 0;
  const depthWidth = {};
  let maxDepth = 0;
  byId = new Map();

  function visit(node, depth){
    node._depth = depth;
    node._w = nodeWidth(node);
    byId.set(node.id, node);
    depthWidth[depth] = Math.max(depthWidth[depth] || 0, node._w);
    maxDepth = Math.max(maxDepth, depth);
    const folded = collapsed.has(node.id);
    const kids = (!folded && node.children && node.children.length) ? node.children : [];
    node._kids = kids;
    vis.push(node);
    if (!kids.length){ node._y = cursor; cursor += ROW; }
    else {
      kids.forEach(k => visit(k, depth + 1));
      node._y = (kids[0]._y + kids[kids.length - 1]._y) / 2;
    }
  }
  visit(DATA, 0);

  const offset = [];
  let x = 0;
  for (let d = 0; d <= maxDepth; d++){ offset[d] = x; x += (depthWidth[d] || MINW) + GAP; }
  vis.forEach(n => { n._x = offset[n._depth]; });
  bounds = { w: Math.max(x - GAP, 400), h: Math.max(cursor, 200) };
  return vis;
}

function render(){
  parentIndex = new Map();
  walkAll(DATA, 0, n => (n.children || []).forEach(c => parentIndex.set(c.id, n.id)));

  const vis = computeLayout();
  const q = query.trim().toLowerCase();
  const hits = new Set();
  if (q){
    vis.forEach(n => {
      if ((n.label + " " + (n.detail || "")).toLowerCase().indexOf(q) >= 0) hits.add(n.id);
    });
  }
  const linkParts = [], nodeParts = [];
  vis.forEach(n => {
    const dim = q && !hits.has(n.id) ? " dim" : "";
    const hit = hits.has(n.id) ? " hit" : "";
    (n._kids || []).forEach(k => {
      linkParts.push(`<path class="link" data-parent="${escapeHtml(n.id)}" data-child="${escapeHtml(k.id)}" d="${pathD(n._x + n._w, n._y, k._x, k._y)}" stroke="${nodeColor(k)}" stroke-opacity="0.55"/>`);
    });
    const color = nodeColor(n);
    const textColor = (n.kind === "root" || n.kind === "bigbang") ? "#0b0f19" : "#08111f";
    nodeParts.push(
      `<g class="node${dim}${hit}" data-id="${escapeHtml(n.id)}" transform="translate(${n._x},${n._y})">` +
      `<rect x="0" y="${-NODEH/2}" width="${n._w}" height="${NODEH}" rx="9" fill="${color}"/>` +
      `<text x="${PADX}" y="1" fill="${textColor}">${escapeHtml(labelText(n))}</text>` +
      `</g>`
    );
  });
  linksG.innerHTML = linkParts.join("");
  nodesG.innerHTML = nodeParts.join("");
  applyTransform();
  syncZoomUI();
  if (!tl.classList.contains("hidden")) renderTimeline();
}

function applyTransform(){
  viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}
function syncZoomUI(){
  zoomSlider.value = Math.round(scale * 100);
  zoomVal.textContent = Math.round(scale * 100) + "%";
}
function visibleCenter(){
  const rect = svg.getBoundingClientRect();
  const panelH = tl.classList.contains("hidden") ? 0 : tl.offsetHeight;
  return { cx: rect.width / 2, cy: Math.max(60, (rect.height - panelH) / 2) };
}
function setScale(next, cx, cy){
  next = Math.min(3.5, Math.max(0.08, next));
  if (cx == null){ const c = visibleCenter(); cx = c.cx; cy = c.cy; }
  tx = cx - (cx - tx) * (next / scale);
  ty = cy - (cy - ty) * (next / scale);
  scale = next;
  applyTransform(); syncZoomUI();
}
function fit(){
  const c = visibleCenter();
  const s = Math.min((svg.getBoundingClientRect().width - 90) / bounds.w,
                     (c.cy * 2 - 60) / bounds.h, 1.6);
  scale = Math.max(0.08, s);
  tx = Math.max(20, (svg.getBoundingClientRect().width - bounds.w * scale) / 2);
  ty = Math.max(20, c.cy - bounds.h * scale / 2);
  applyTransform(); syncZoomUI();
}
function resetZoom(){
  scale = 1;
  const c = visibleCenter();
  tx = 40; ty = Math.max(20, c.cy - bounds.h / 2);
  applyTransform(); syncZoomUI();
}
function highlightChain(id){
  const chain = new Set(), links = new Set();
  let cur = id;
  while (cur){
    chain.add(cur);
    const parent = parentIndex.get(cur);
    if (!parent) break;
    links.add(parent + ">" + cur);
    cur = parent;
  }
  document.querySelectorAll("g.node").forEach(el =>
    el.classList.toggle("active", chain.has(el.getAttribute("data-id"))));
  document.querySelectorAll("path.link").forEach(el =>
    el.classList.toggle("active",
      links.has(el.getAttribute("data-parent") + ">" + el.getAttribute("data-child"))));
}
function clearHighlight(){
  document.querySelectorAll("g.node.active, path.link.active")
    .forEach(el => el.classList.remove("active"));
}
function revealNode(id){
  let cur = id;
  const path = [];
  while (cur){ path.push(cur); cur = parentIndex.get(cur); }
  path.forEach(p => collapsed.delete(p));
  render();
  const node = byId.get(id);
  if (!node) return;
  const c = visibleCenter();
  tx = c.cx - (node._x + node._w / 2) * scale;
  ty = c.cy - node._y * scale;
  applyTransform();
  clearHighlight(); highlightChain(id);
  selectedId = id;
  showPanel(node);
}
function findParentId(id){ return parentIndex.get(id); }

/* ------------------------------------------------------------------ */
/* details panel                                                       */
/* ------------------------------------------------------------------ */
function showPanel(node){
  if (!node) return;
  selectedId = node.id;
  const rows = Object.keys(node.meta || {}).map(k =>
    `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(node.meta[k])}</td></tr>`).join("");
  let actions = "";
  if (LIVE){
    const canExpand = CAN_EXPAND[node.kind] !== 0;
    actions = `<div class="actions">
      <button data-pact="expand" data-id="${escapeHtml(node.id)}" ${canExpand ? "" : "disabled"}>✨ 展开子节点</button>
      <button data-pact="continue" data-id="${escapeHtml(node.id)}">✍ 续写叙事</button>
    </div><div class="status" id="pstat"></div>`;
  }
  panel.innerHTML =
    `<span class="close" data-close="1">✕</span>` +
    `<div class="kind">${escapeHtml(KIND_LABEL[node.kind] || node.kind)}</div>` +
    `<h2 style="color:${nodeColor(node)}">${escapeHtml(node.label)}</h2>` +
    (node.detail ? `<p>${escapeHtml(node.detail)}</p>` : "") +
    (rows ? `<table>${rows}</table>` : "") + actions;
  panel.classList.remove("hidden");
}
async function callExpand(id, action, btn){
  const node = byId.get(id);
  if (!node) return;
  const stat = document.getElementById("pstat");
  const buttons = panel.querySelectorAll("button[data-pact]");
  buttons.forEach(b => b.disabled = true);
  if (stat) stat.textContent = action === "expand" ? "正在生成新的分支…" : "正在续写…";
  try {
    const res = await fetch(API_BASE + "/api/expand", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, action: action })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    if (data.narrative) node.detail = data.narrative;
    if (Array.isArray(data.children) && data.children.length){
      node.children = (node.children || []).concat(data.children);
      collapsed.delete(id);
    }
    render();
    showPanel(byId.get(id));
    const stat2 = document.getElementById("pstat");
    if (stat2) stat2.textContent = "完成 ✓";
  } catch (err){
    if (stat) stat.textContent = "失败：" + err.message;
    buttons.forEach(b => { if (!b.dataset.perm) b.disabled = false; });
    showToast("LLM 调用失败：" + err.message);
  }
}

/* ------------------------------------------------------------------ */
/* mind map interactions                                               */
/* ------------------------------------------------------------------ */
function toggle(node){
  if (node.children && node.children.length){
    if (collapsed.has(node.id)) collapsed.delete(node.id);
    else collapsed.add(node.id);
  }
  render();
  showPanel(node);
}
nodesG.addEventListener("click", e => {
  const g = e.target.closest("g.node");
  if (!g) return;
  const node = byId.get(g.getAttribute("data-id"));
  if (node) toggle(node);
});
panel.addEventListener("click", e => {
  if (e.target.getAttribute("data-close")){ panel.classList.add("hidden"); clearHighlight(); return; }
  const act = e.target.getAttribute && e.target.getAttribute("data-pact");
  if (act) callExpand(e.target.getAttribute("data-id"), act, e.target);
});
nodesG.addEventListener("mouseover", e => {
  const g = e.target.closest("g.node");
  if (g) highlightChain(g.getAttribute("data-id"));
});
nodesG.addEventListener("mouseout", e => { if (e.target.closest("g.node")) clearHighlight(); });

let dragging = false, lastX = 0, lastY = 0;
svg.addEventListener("mousedown", e => {
  if (e.target.closest("g.node")) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener("mouseup", () => { dragging = false; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  setScale(scale * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

window.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.key === "+" || e.key === "=") setScale(scale * 1.15);
  else if (e.key === "-" || e.key === "_") setScale(scale / 1.15);
  else if (e.key === "0") resetZoom();
  else if (e.key === "f" || e.key === "F") fit();
});

document.getElementById("bar").addEventListener("click", e => {
  const act = e.target.getAttribute && e.target.getAttribute("data-act");
  if (!act) return;
  if (act === "in") setScale(scale * 1.2);
  else if (act === "out") setScale(scale / 1.2);
  else if (act === "fit") fit();
  else if (act === "reset") resetZoom();
  else if (act === "expandall"){ collapsed.clear(); render(); }
  else if (act === "collapse"){
    collapsed.clear();
    walkAll(DATA, 0, (n, d) => { if (n.children && n.children.length && d >= 1) collapsed.add(n.id); });
    render();
  } else if (act === "timeline") toggleTimeline();
  else if (act === "svg") exportSvg();
});
zoomSlider.addEventListener("input", () => setScale(Number(zoomSlider.value) / 100));
searchBox.addEventListener("input", () => { query = searchBox.value; render(); });

function exportSvg(){
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("viewBox", `0 0 ${Math.round(bounds.w + 80)} ${Math.round(bounds.h + 80)}`);
  clone.setAttribute("width", Math.round(bounds.w + 80));
  clone.setAttribute("height", Math.round(bounds.h + 80));
  const vp = clone.querySelector("#viewport");
  if (vp){
    vp.setAttribute("transform", "translate(40,40) scale(1)");
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("x", "0"); bg.setAttribute("y", "0");
    bg.setAttribute("width", "100%"); bg.setAttribute("height", "100%");
    bg.setAttribute("fill", "#0b0f19");
    vp.parentNode.insertBefore(bg, vp);
  }
  const blob = new Blob([clone.outerHTML], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cosmos-mindmap.svg";
  a.click();
  URL.revokeObjectURL(a.href);
}

function toggleTimeline(){
  tl.classList.toggle("hidden");
  document.getElementById("tl-toggle").classList.toggle("on", !tl.classList.contains("hidden"));
  if (!tl.classList.contains("hidden")) renderTimeline();
}
function collectTimeline(){
  const universes = (DATA.children || []).filter(c => c.kind === "universe");
  const bb = (DATA.children || []).find(c => c.kind === "bigbang");
  let maxAge = 0;
  universes.forEach(u => { maxAge = Math.max(maxAge, Number((u.meta || {}).age_gyr || 0)); });
  maxAge = Math.ceil(Math.max(maxAge, 1));

  const rows = [];
  universes.forEach(u => {
    const uAge = Number((u.meta || {}).age_gyr || maxAge);
    rows.push({ label: u.label, id: u.id, barTo: uAge, bar: "#5b8def", events: [] });
    const uEvents = (u.children || []).filter(c => c.kind === "event");
    if (uEvents.length)
      rows.push({ label: "宇宙事件", id: u.id, barTo: 0, bar: null, events: uEvents });
    (u.children || []).filter(c => c.kind === "planet").forEach(p => {
      rows.push({ label: p.label, id: p.id, barTo: uAge, bar: "#3fbf7f",
                  events: (p.children || []).filter(c => c.kind === "event") });
    });
  });
  const epochs = bb ? (bb.children || []).filter(c => c.kind === "epoch") : [];
  return { rows, maxAge, epochs };
}
function niceStep(maxAge, plotW){
  const candidates = [0.1, 0.25, 0.5, 1, 2, 5, 10, 20, 50];
  for (const s of candidates){ if (plotW / (maxAge / s) >= 64) return s; }
  return 100;
}
function renderTimeline(){
  const { rows, maxAge, epochs } = collectTimeline();
  const box = tlBody.getBoundingClientRect();
  const gutter = 176, padR = 26, stripH = 60, rowH = 24;
  const W = Math.max(360, Math.floor(box.width));
  const H = stripH + 10 + rows.length * rowH + 26;
  tlSvg.setAttribute("width", W); tlSvg.setAttribute("height", H);
  tlSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const plotW = Math.max(80, W - gutter - padR);
  const x = t => gutter + (Math.min(Math.max(t, 0), maxAge) / maxAge) * plotW;
  const p = [];
  p.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="none"/>`);
  p.push(`<text x="10" y="16" class="tl-cap">大爆炸纪元 · 对数时间</text>`);

  /* log-scale epoch strip */
  const minLog = -44, maxLog = 9;
  const lx = s => gutter + ((Math.log10(Math.max(s, 1e-45)) - minLog) / (maxLog - minLog)) * plotW;
  p.push(`<line x1="${gutter}" y1="44" x2="${gutter + plotW}" y2="44" class="tl-axis"/>`);
  p.push(`<text x="${gutter - 6}" y="47" class="tl-gridlabel" text-anchor="end">10⁻⁴⁴s</text>`);
  p.push(`<text x="${gutter + plotW}" y="47" class="tl-gridlabel" text-anchor="end">10⁹s</text>`);
  epochs.forEach((e, i) => {
    const sec = Number((e.meta || {}).age_years || 0) * SEC_PER_YEAR;
    const px = lx(sec);
    const ty2 = (i % 2 === 0) ? 24 : 34;
    p.push(`<line x1="${px}" y1="38" x2="${px}" y2="50" class="tl-tick"/>`);
    p.push(`<circle cx="${px}" cy="44" r="3.4" fill="#ff8a3d"/>`);
    p.push(`<text x="${px}" y="${ty2}" class="tl-elabel" text-anchor="middle">${escapeHtml(e.label)}</text>`);
    p.push(`<g class="tl-ev" data-node="${escapeHtml(e.id)}"><rect x="${px - 6}" y="${ty2 - 10}" width="12" height="26" fill="transparent"/><title>${escapeHtml(e.label)} · ${escapeHtml(((e.meta||{}).age)||"")}</title></g>`);
  });

  /* linear Gyr axis + rows */
  const top = stripH + 10;
  const step = niceStep(maxAge, plotW);
  for (let t = 0; t <= maxAge + 1e-9; t += step){
    const px = x(t);
    p.push(`<line x1="${px}" y1="${top - 6}" x2="${px}" y2="${top + rows.length * rowH}" class="tl-grid"/>`);
    p.push(`<text x="${px}" y="${top + rows.length * rowH + 16}" class="tl-gridlabel" text-anchor="middle">${(Math.round(t * 100) / 100)}</text>`);
  }
  p.push(`<text x="${gutter - 6}" y="${top + 4}" class="tl-gridlabel" text-anchor="end">Gyr →</text>`);

  rows.forEach((row, i) => {
    const cy = top + i * rowH + rowH / 2 - 4;
    p.push(`<text x="12" y="${cy + 4}" class="tl-rowlabel" data-node="${escapeHtml(row.id)}" style="cursor:pointer">${escapeHtml(String(row.label).slice(0, 22))}</text>`);
    if (row.bar && row.barTo > 0){
      p.push(`<rect class="tl-bar" x="${x(0)}" y="${cy - 4}" width="${Math.max(2, x(row.barTo) - x(0))}" height="8" rx="3" fill="${row.bar}"/>`);
    }
    row.events.forEach(ev => {
      const age = Number((ev.meta || {}).age_gyr || 0);
      const sev = Number((ev.meta || {}).severity || 0.5);
      const px = x(age), r = 2.6 + sev * 4;
      p.push(`<g class="tl-ev" data-node="${escapeHtml(ev.id)}">` +
        `<circle cx="${px}" cy="${cy}" r="${r}" fill="${sevColor(sev)}" fill-opacity="0.92"/>` +
        `<title>${escapeHtml(ev.label)} · ${age.toFixed(2)} Gyr · 严重度 ${sev.toFixed(2)}</title></g>`);
    });
  });
  tlSvg.innerHTML = p.join("");
}
tlSvg.addEventListener("click", e => {
  const g = e.target.closest("[data-node]");
  if (g) revealNode(g.getAttribute("data-node"));
});
let tlResizing = false;
document.getElementById("tl-handle").addEventListener("mousedown", () => { tlResizing = true; });
window.addEventListener("mousemove", e => {
  if (!tlResizing) return;
  const h = Math.min(window.innerHeight - 140, Math.max(150, window.innerHeight - e.clientY));
  tl.style.height = h + "px";
  renderTimeline();
});
window.addEventListener("mouseup", () => { tlResizing = false; });
if (window.ResizeObserver) new ResizeObserver(() => { if (!tl.classList.contains("hidden")) renderTimeline(); }).observe(tlBody);
window.addEventListener("resize", () => { if (!tl.classList.contains("hidden")) renderTimeline(); });

/* legend + init                                                       */
/* ------------------------------------------------------------------ */
(function initLegend(){
  const el = document.getElementById("legend");
  const order = ["root","bigbang","epoch","universe","planet","event"];
  el.innerHTML = "<b style='font-size:11px;letter-spacing:1px;color:#8b97b0'>LEGEND</b>" +
    order.map(k => `<div class="row"><span class="chip" style="background:${KIND_COLORS[k]}"></span>${KIND_LABEL[k]}</div>`).join("");
})();

if (!LIVE){
  const toggle = document.getElementById("tl-toggle");
  toggle.title = "打开时间线";
}
render();
fit();
</script>
